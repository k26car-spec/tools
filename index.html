<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>營運工具中心</title><style>
:root{color-scheme:light;--bg:#f2f4f7;--card:#fff;--ink:#20242c;--muted:#727985;--line:#e6e9ee;--blue:#2563eb;--blue-dark:#163d8f;--cyan:#13a8a8;--orange:#ef8a25;--green:#118b58;--shadow:0 18px 45px rgba(34,46,69,.08);--sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 92% 3%,rgba(37,99,235,.10),transparent 27%),radial-gradient(circle at 4% 94%,rgba(19,168,168,.08),transparent 28%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}.shell{max-width:1240px;margin:auto;padding:28px 24px 64px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:62px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--blue),var(--blue-dark));display:grid;place-items:center;color:white;font-size:20px;box-shadow:0 8px 20px rgba(37,99,235,.22)}.brand b{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.privacy{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:99px;padding:9px 13px;color:var(--green);font-size:11px;font-weight:750}.privacy i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(17,139,88,.1)}.hero{text-align:center;max-width:760px;margin:0 auto 38px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--blue);font-weight:800;margin-bottom:12px}.hero h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em;margin:0 0 13px}.hero p{color:var(--muted);font-size:14px;line-height:1.75;margin:0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:22px}.tool-card{position:relative;text-align:left;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.9);border-radius:26px;padding:27px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.tool-card:hover{transform:translateY(-4px);box-shadow:0 24px 58px rgba(34,46,69,.13)}.tool-card:focus-visible{outline:3px solid rgba(37,99,235,.25);outline-offset:3px}.tool-card:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-76px;top:-90px;background:var(--glow)}.tool-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.tool-icon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--icon-bg);color:var(--icon);font-size:25px}.open-arrow{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f3f5f8;color:#59616e;font-size:18px}.tool-card h2{font-size:22px;margin:25px 0 9px}.tool-card>p{color:var(--muted);font-size:12px;line-height:1.7;min-height:42px;margin:0 0 24px}.requirements{display:grid;gap:9px;margin-bottom:22px}.requirement{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:650}.requirement span{width:24px;height:24px;border-radius:8px;background:#f2f5fa;display:grid;place-items:center;color:var(--blue);font:700 10px ui-monospace,monospace}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:10px;color:#6e7580;background:#f3f5f7;border-radius:99px;padding:5px 8px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.flow-step{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--muted);font-size:10px}.flow-step b{width:25px;height:25px;border-radius:8px;background:#e8eefc;color:var(--blue);display:grid;place-items:center;font:800 10px ui-monospace,monospace}.workspace{display:none}.workspace.active{display:block}.workspace-bar{position:sticky;top:10px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.98);border-radius:17px;padding:9px 10px;margin-bottom:13px;box-shadow:0 9px 25px rgba(40,45,55,.08);backdrop-filter:blur(16px)}.workspace-left,.tool-tabs{display:flex;align-items:center;gap:6px}.home-btn,.tool-tab{border:0;border-radius:11px;padding:9px 12px;background:transparent;color:#656c77;font-size:11px;font-weight:700;cursor:pointer}.home-btn{background:#f2f4f7}.tool-tab.active{background:var(--ink);color:#fff}.workspace-status{font-size:10px;color:var(--muted);padding-right:6px}.frame-shell{background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.95);min-height:640px}.frame-loader{height:260px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px}.spinner{width:32px;height:32px;border:3px solid #e5e8ed;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 13px}@keyframes spin{to{transform:rotate(360deg)}}iframe{width:100%;min-height:720px;border:0;display:none;background:#fff}.foot{text-align:center;color:#9aa0a9;font-size:10px;margin-top:34px;line-height:1.65}
.tool-card{appearance:none;color:inherit;font:inherit}
@media(max-width:760px){.shell{padding:18px 11px 45px}.topbar{margin-bottom:42px}.privacy{font-size:0;padding:10px}.privacy i{margin:0}.tools{grid-template-columns:1fr;gap:13px}.tool-card{padding:22px;border-radius:21px}.tool-card h2{font-size:19px}.tool-card>p{min-height:0}.flow{grid-template-columns:1fr;margin-top:15px}.workspace-bar{align-items:flex-start;flex-direction:column}.workspace-left{width:100%;justify-content:space-between}.tool-tabs{width:100%}.tool-tab{flex:1}.workspace-status{display:none}.frame-shell{border-radius:18px}iframe{min-height:760px}}
</style></head><body><main class="shell"><section id="landing"><header class="topbar"><div class="brand"><div class="brand-mark">▦</div><div><b>營運工具中心</b><small>OPERATIONS WORKSPACE</small></div></div><div class="privacy"><i></i>檔案只在這台電腦處理</div></header><div class="hero"><div class="eyebrow">SELECT A WORKFLOW</div><h1>今天要處理哪一項工作？</h1><p>兩套 Excel 工具集中在同一個入口。選擇工作後上傳檔案、確認結果並下載，全程不會把資料傳到網路。</p></div><div class="tools"><button class="tool-card" style="--glow:rgba(37,99,235,.09);--icon-bg:#edf3ff;--icon:#2563eb" data-tool="shipment"><div class="tool-head"><div class="tool-icon">⇄</div><div class="open-arrow">→</div></div><h2>福城出貨 → 京虹格式</h2><p>合併銷售訂單分析報表與銷售出入庫明細，檢查數量後產出京虹固定格式。</p><div class="requirements"><div class="requirement"><span>1</span>銷售訂單分析報表</div><div class="requirement"><span>2</span>銷售出入庫明細表</div></div><div class="tags"><span class="tag">兩份 Excel</span><span class="tag">數量檢查</span><span class="tag">京虹格式輸出</span></div></button><button class="tool-card" style="--glow:rgba(19,168,168,.10);--icon-bg:#e9f8f7;--icon:#129897" data-tool="images"><div class="tool-head"><div class="tool-icon">▧</div><div class="open-arrow">→</div></div><h2>訂單本補圖</h2><p>從電子檔依型號尋找商品圖片，自動貼到手本對應位置並產出已補圖版本。</p><div class="requirements"><div class="requirement"><span>1</span>電子檔（圖片來源）</div><div class="requirement"><span>2</span>手本（貼圖目標）</div></div><div class="tags"><span class="tag">兩份 Excel</span><span class="tag">型號比對</span><span class="tag">圖片自動置中</span></div></button></div><div class="flow"><div class="flow-step"><b>01</b>選擇工具與來源檔案</div><div class="flow-step"><b>02</b>在瀏覽器本機完成處理</div><div class="flow-step"><b>03</b>確認結果並下載新檔案</div></div></section><section class="workspace" id="workspace"><div class="workspace-bar"><div class="workspace-left"><button class="home-btn" id="home-btn">← 工具首頁</button><div class="tool-tabs"><button class="tool-tab" data-tool="shipment">出貨格式合併</button><button class="tool-tab" data-tool="images">訂單本補圖</button></div></div><span class="workspace-status" id="workspace-status">檔案不會上傳</span></div><div class="frame-shell"><div class="frame-loader" id="loader"><div><div class="spinner"></div>正在載入工具…</div></div><iframe id="tool-frame" title="營運工具"></iframe></div></section><div class="foot">本機離線工具｜原始 Excel 只存在瀏覽器記憶體，完成後請下載並保存結果</div></main><script>
const tools={shipment:{src:'tools/shipment-merge.html',title:'福城出貨 → 京虹格式合併'},images:{src:'tools/order-image.html',title:'訂單本補圖'}};const landing=document.getElementById('landing'),workspace=document.getElementById('workspace'),frame=document.getElementById('tool-frame'),loader=document.getElementById('loader'),status=document.getElementById('workspace-status');let resizeObserver;
function showHome(push=true){landing.style.display='block';workspace.classList.remove('active');frame.style.display='none';frame.removeAttribute('src');if(resizeObserver)resizeObserver.disconnect();document.title='營運工具中心';if(push)history.pushState(null,'',location.pathname);scrollTo({top:0,behavior:'smooth'})}
function openTool(key,push=true){const tool=tools[key];if(!tool)return showHome(push);landing.style.display='none';workspace.classList.add('active');loader.style.display='grid';frame.style.display='none';document.querySelectorAll('.tool-tab').forEach(x=>x.classList.toggle('active',x.dataset.tool===key));status.textContent=`${tool.title}｜檔案不會上傳`;document.title=`${tool.title}｜營運工具中心`;if(frame.getAttribute('src')!==tool.src)frame.src=tool.src;else finishLoad();if(push)history.pushState({tool:key},'',`#${key}`);scrollTo({top:0,behavior:'smooth'})}
function finishLoad(){loader.style.display='none';frame.style.display='block';try{if(resizeObserver)resizeObserver.disconnect();const doc=frame.contentDocument;const resize=()=>frame.style.height=Math.max(720,doc.documentElement.scrollHeight,doc.body.scrollHeight)+24+'px';resize();resizeObserver=new ResizeObserver(resize);resizeObserver.observe(doc.body)}catch(e){frame.style.height='900px'}}
frame.addEventListener('load',finishLoad);document.querySelectorAll('[data-tool]').forEach(x=>x.addEventListener('click',()=>openTool(x.dataset.tool)));document.getElementById('home-btn').addEventListener('click',()=>showHome());addEventListener('popstate',()=>{const key=location.hash.slice(1);key?openTool(key,false):showHome(false)});const initial=location.hash.slice(1);if(initial)openTool(initial,false);
</script></body></html>
